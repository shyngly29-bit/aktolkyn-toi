<style>
  :root{--bg:#F1ECF8;--lav:#A994DF;--lav2:#D9CFF0;--gold:#C9A66B;--gold-d:#94723a;--light:#F8F2E9;--dark:#201B35;--text:#30263E}
  *{box-sizing:border-box}
  html,body{margin:0;background:#16122a;color:var(--light);font-family:'Noto Sans',sans-serif;-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  body.locked{overflow:hidden;height:100%}
  .app{max-width:430px;margin:0 auto;position:relative}
  .serif{font-family:'Cormorant Garamond',serif}
  .foil{background:linear-gradient(100deg,#b8913f 0%,#e9cf98 30%,#fff6e0 45%,#cdb0ee 60%,#b8913f 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 6s linear infinite}
  @keyframes foil{from{background-position:100% 0}to{background-position:-160% 0}}
  .k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}

  /* ---------- 3D story ---------- */
  #c{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,430px);height:100vh;height:100lvh;display:block;z-index:0;background:var(--dark)}
  #flash{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,430px);height:100vh;height:100lvh;pointer-events:none;z-index:2;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,250,240,.95),rgba(217,207,240,.7) 45%,rgba(169,148,223,0) 80%)}
  .story{position:relative;height:1000vh;z-index:1}
  .txt{position:fixed;left:50%;transform:translateX(-50%);width:min(100vw,430px);z-index:5;text-align:center;opacity:0;visibility:hidden;pointer-events:none;padding:0 14px}
  .txt.bottom{bottom:0;padding-top:90px;padding-bottom:calc(26px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(22,18,42,.92) 0%,rgba(22,18,42,.72) 55%,rgba(22,18,42,0) 100%)}
  .txt.top{top:0;padding-top:calc(64px + env(safe-area-inset-top));padding-bottom:70px;
    background:linear-gradient(to bottom,rgba(22,18,42,.85) 0%,rgba(22,18,42,.55) 55%,rgba(22,18,42,0) 100%)}
  .txt h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:56px;line-height:1;margin:8px 0 2px}
  .poem{font-family:'Cormorant Garamond',serif;font-size:19.5px;line-height:1.34;font-weight:500;font-style:italic;margin:0;color:var(--light);text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .poem .l{display:block;opacity:0;transform:translateY(8px)}
  .orn{display:block;width:120px;height:24px;margin:6px auto 0}
  .hint{font-size:12px;letter-spacing:.05em;color:var(--lav2);margin-top:10px}
  .hint span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(5px)}}
  .bigd{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:78px;line-height:.9;margin-top:6px}
  .mon{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px}
  .wd{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--lav2);margin-top:4px}
  .venue{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:6px 0 2px}
  .addr{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--lav2)}

  /* ---------- gate / envelope ---------- */
  #gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 38%,#3a2f63 0%,#221c3d 55%,#120f22 100%);transition:opacity 1.2s ease,visibility 1.2s}
  #gate.hide{opacity:0;visibility:hidden}
  #gate>*:not(canvas){position:relative;z-index:1}
  #gfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  #gate h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;margin:6px 0 0;color:var(--light)}
  .env{position:relative;width:300px;max-width:82vw;aspect-ratio:3/2;margin:30px auto 0;perspective:900px;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
  #gate.hide .env{transform:scale(1.2) translateY(-12px)}
  .env-back{position:absolute;inset:0;background:#efe6f5;border-radius:10px;box-shadow:0 26px 60px rgba(0,0,0,.45),0 0 60px rgba(169,148,223,.25)}
  .peek{position:absolute;left:7%;right:7%;top:7%;height:86%;background:#fffdfa;border:1px solid var(--lav2);border-radius:6px;z-index:1;color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .55s}
  .peek b{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700}
  .env.open .peek{transform:translateY(-58%)}
  .env-front{position:absolute;inset:0;z-index:2;border-radius:10px;background:linear-gradient(160deg,#f6f0fa,#e2d6ef);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
  .env-lines{position:absolute;inset:0;z-index:2;pointer-events:none}
  .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;background:linear-gradient(#eee4f6,#d9cbea);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .75s cubic-bezier(.4,.1,.3,1),z-index 0s .38s}
  .env.open .flap{transform:rotateX(180deg);z-index:0}
  .seal{position:absolute;left:50%;top:60%;z-index:4;width:74px;height:74px;margin:-37px 0 0 -37px;border:0;padding:0;background:none;cursor:pointer;transition:transform .45s cubic-bezier(.5,-.4,.6,1.4),opacity .4s;animation:pulse 2.2s ease-in-out infinite;border-radius:50%}
  .seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(40,20,80,.5))}
  @keyframes pulse{50%{box-shadow:0 0 0 12px rgba(169,148,223,.18)}}
  .env.open .seal{transform:scale(0) rotate(40deg);opacity:0;animation:none}
  .tap{margin-top:20px;font-size:12px;color:var(--lav2);letter-spacing:.05em}
  .load{margin-top:8px;font-size:11px;color:#9d93bd;letter-spacing:.12em;min-height:14px}
  .seal[disabled]{opacity:.55;animation:none;cursor:wait}

  /* ---------- invitation card ---------- */
  .after{position:relative;z-index:3;padding:46px 16px calc(56px + env(safe-area-inset-bottom));text-align:center;color:var(--text);
    background:linear-gradient(rgba(241,236,248,0),var(--bg) 120px),url(a/paper.webp) center/360px repeat,var(--bg);overflow:hidden}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .after>*:not(canvas){position:relative;z-index:1}
  .after .k{color:var(--gold-d)}
  .after h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;margin:6px 0 0}
  .invite{margin:22px auto 0;max-width:390px;padding:40px 22px 34px;background:rgba(255,253,250,.94);border-radius:8px;position:relative;
    box-shadow:0 30px 70px rgba(48,38,62,.22),0 0 0 1px rgba(201,166,107,.6) inset;opacity:0;transform:scale(.92) translateY(24px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .invite::before{content:'';position:absolute;inset:12px;border:1px solid rgba(169,148,223,.45);border-radius:4px;pointer-events:none}
  .invite.show{opacity:1;transform:none}
  .corner{position:absolute;width:56px;height:56px}
  .corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1)}
  .draw path,.draw circle{stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 2.4s ease .4s}
  .invite.show .draw path,.invite.show .draw circle{stroke-dashoffset:0}
  .r{opacity:0;transform:translateY(14px);transition:opacity .8s ease calc(var(--i)*.14s + .35s),transform .8s ease calc(var(--i)*.14s + .35s)}
  .invite.show .r{opacity:1;transform:none}
  .shan{width:64px;height:64px;margin:0 auto 4px;display:block}
  .invite .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:60px;line-height:1;margin:6px 0 0}
  .invite .prose{font-family:'Cormorant Garamond',serif;font-size:19.5px;line-height:1.4;margin:12px 0}
  .invite .prose b{color:#7a5fc0}
  .dateblk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 4px}
  .dateblk .side{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:7px 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
  .dateblk .day{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:66px;line-height:.9;color:#7a5fc0}
  .dateblk .mo{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600}
  .yr{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.3em;color:var(--gold-d)}
  .place{margin:16px 0 4px}
  .place .venue{font-size:26px;color:var(--text)}
  .place .addr{color:var(--text);opacity:.85}
  .cd{display:flex;justify-content:center;gap:7px;margin:18px 0 4px}
  .cd div{min-width:62px;padding:9px 3px;border-radius:12px;background:#f6f1fb;border:1px solid var(--lav2)}
  .cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;color:#7a5fc0;line-height:1}
  .cd i{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#7b6f8f}
  .invite .poem{color:var(--text);text-shadow:none;font-size:19.5px;margin:16px 0 0}
  .invite .poem .l{opacity:1;transform:none}
  .hosts{font-family:'Cormorant Garamond',serif;font-size:19px;margin-top:16px}
  .hosts b{display:block;font-size:23px;color:var(--gold-d);font-style:italic}
  .btns{display:flex;gap:8px;margin-top:18px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold-d);font:600 12.5px 'Noto Sans',sans-serif;text-decoration:none;cursor:pointer}
  .btn[hidden]{display:none}
  .btn svg{width:16px;height:16px}

  /* ---------- buttons ---------- */
  .fab{position:fixed;top:calc(env(safe-area-inset-top) + 10px);z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,166,107,.8);
    background:rgba(32,27,53,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--gold);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .fab svg{width:18px;height:18px}
  #auto{left:max(10px, calc(50% - 205px))}
  #music{right:max(10px, calc(50% - 205px))}
  #music.off{opacity:.5}
  #auto.pulse{animation:pulse 2s ease-in-out infinite}

  @media (prefers-reduced-motion: reduce){
    .foil,.seal,.hint span{animation:none}
    .r,.invite,.peek,.flap,#gate,.env,.draw path,.draw circle{transition-duration:.01s!important;transition-delay:0s!important}
  }
</style>
</head>

function buildDisplacement(){
  locs.forEach(loc=>{
    if(!loc.depthImg) return;
    const cv=document.createElement('canvas'); cv.width=256; cv.height=128;
    const cx=cv.getContext('2d'); cx.drawImage(loc.depthImg,0,0,256,128);
    const d=cx.getImageData(0,0,256,128).data, geo=loc.bg.geometry, p=geo.attributes.position, uv=geo.attributes.uv;
    for(let i=0;i<p.count;i++){
      const u=uv.getX(i), v=uv.getY(i), x=Math.min(255,Math.round(u*255)), y=Math.min(127,Math.round((1-v)*127));
      p.setZ(i,d[(y*256+x)*4]/255*DEPTH);
    }
    p.needsUpdate=true; geo.computeBoundingSphere();
  });
  last=-1; render();
}

function setRole(loc,role){
  if(role==='hide'){ loc.g.visible=false; return; }
  loc.g.visible=true;
  const st=(m,func)=>{ if(func===null){ m.stencilWrite=false; } else { m.stencilWrite=true; m.stencilRef=1; m.stencilFunc=func; m.stencilFail=m.stencilZFail=m.stencilZPass=THREE.KeepStencilOp; } m.needsUpdate=true; };
  if(role==='cur'){ st(loc.bgMat,THREE.NotEqualStencilFunc); loc.mats.forEach(m=>st(m,null)); }
  else { st(loc.bgMat,THREE.EqualStencilFunc); loc.mats.forEach(m=>st(m,THREE.EqualStencilFunc)); }
  loc.mask.visible=false;
}
let roles=[];

/* camera path */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const camPos=V3(0,0,0), camLook=V3(0,0,0), tmp=V3(0,0,0), follow=V3(0,0,0);
function sceneOf(p){ for(let i=0;i<6;i++) if(p<R[i][1]) return i; return 5; }
function camAt(p){
  const i=sceneOf(p), o=-L*i, t=seg(p,R[i][0],R[i][1]);
  if(i===0){
    const a=ss(seg(p,0,.09)), b=ss(seg(p,.09,.15)), c=seg(p,.15,.26);
    const A=[GIRL.x,lerp(-2.6,-2.3,a),lerp(23,20.5,a)], B=[-1.0,-1.2,16.6];
    let x=lerp(A[0],B[0],b), y=lerp(A[1],B[1],b), z=lerp(A[2],B[2],b);
    const cz=ease(c); x=lerp(x,0,ss(c)); y=lerp(y,0,ss(c)); z=lerp(z,PZ,c*.35+cz*.65);
    camPos.set(x,y,z);
  } else if(i===5){
    camPos.set(0,lerp(0,-.25,ease(t)),o+lerp(16,10.2,easeOut(seg(t,0,.7))));
  } else camPos.set(0,0,o+lerp(16,PZ,t));
  camPos.x+=Math.sin(p*40)*.06*(i>0&&i<5?1:0); camPos.y+=Math.cos(p*33)*.04*(i>0&&i<5?1:0);
  return i;
}

let time=0, lastT=performance.now(), last=-1;
function render(){
  const p=progress();
  if(W3.ok) draw(p);
  texts(p);
}
function draw(p){
  const i=camAt(p);
  // roles: current location + the next one visible through the portal
  for(let k=0;k<6;k++){ const role=k===i?'cur':(k===i+1?'next':'hide'); if(roles[k]!==role){ setRole(locs[k],role); roles[k]=role; } }
  if(i<5){ locs[i].mask.visible=true; }
  // look direction
  follow.set(camPos.x+Math.sin(time*.7)*.18, camPos.y-.5+Math.sin(time*1.1)*.06, camPos.z-3.1);
  if(i===0){
    const look0=V3(GIRL.x,lerp(-3.4,-2.8,ss(seg(p,0,.09))),GIRL.z);
    const dh=doveAt(p);
    const toDove=ss(seg(p,.09,.13)), fwd=ss(seg(p,.15,.21));
    camLook.copy(look0).lerp(dh,toDove).lerp(V3(camPos.x*.6,camPos.y-.3,camPos.z-10),fwd);
  } else if(i===5){
    const t=seg(p,R[5][0],R[5][1]);
    camLook.set(lerp(0,.5,ss(seg(t,.3,.8))),lerp(-.3,-1.1,ss(seg(t,.3,.8))),camPos.z-10);
  } else camLook.set(camPos.x*.5,camPos.y-.2,camPos.z-10);
  camera.position.copy(camPos); camera.lookAt(camLook);

  // girl: release the dove
  if(girlMesh){ const rel=p>=.1; const m=girlMesh.material; if(m.map!==(rel?girlTex.rel:girlTex.hold)){ m.map=rel?girlTex.rel:girlTex.hold; m.needsUpdate=true; } }

  // dove
  const dp=doveAt(p); dove.position.copy(dp); dove.quaternion.copy(camera.quaternion);
  dove.visible=p>=.1;
  let size=1, frame;
  if(p<.155){ const u=ss(seg(p,.1,.155)); size=lerp(.5,1,u); frame=p<.112?doveTex.l[11]:doveTex.b[Math.floor(time*18)%16]; }
  else if(p<.9){ frame=doveTex.b[Math.floor(time*(i>=1&&i<=4?15:18))%16]; }
  else { const u=seg(p,.9,.975); frame=u>=1?doveTex.l[11]:doveTex.l[Math.min(11,Math.floor(u*12))]; size=lerp(1,1.05,u); }
  if(doveMat.map!==frame){ doveMat.map=frame; doveMat.needsUpdate=false; }
  dove.scale.set(size,size,1);

  // foreground props float
  locs.forEach(l=>{ if(!l.g.visible) return; l.fg.forEach(m=>{ const u=m.userData; m.position.y=u.y+Math.sin(time*.6+u.ph)*.12; m.rotation.z=u.rot+Math.sin(time*.4+u.ph)*.05; });
    l.glowMat.opacity=.4+.2*Math.sin(time*1.4+l.i); });

  // petals / feathers drift around the camera
  parts.forEach(s=>{ const u=s.userData;
    u.ox+=u.vx*.016; u.oy+=u.vy*.016; if(u.oy<-4){u.oy=4;u.ox=rnd(-4.5,4.5);} if(Math.abs(u.ox)>5) u.vx*=-1;
    s.position.set(camPos.x+u.ox, camPos.y+u.oy, camPos.z-u.dz); s.material.rotation+=u.vr*.016; });

  // portal flash when passing through
  let fl=0; if(i<5){ const dz=camPos.z-(-L*i+PZ); fl=Math.exp(-dz*dz/2.2)*.42; }
  if(i>0){ const dz=camPos.z-(-L*(i-1)+PZ); fl=Math.max(fl,Math.exp(-dz*dz/2.2)*.42); }
  $('flash').style.opacity=reduced.matches?0:fl.toFixed(3);

  renderer.render(scene,camera);
}
function doveAt(p){
  const hands=V3(...HANDS);
  if(p<.1) return hands;
  if(p<.9){
    const u=ss(seg(p,.1,.2)); return hands.clone().lerp(follow,u);
  }
  const L6=V3(LAND[0],LAND[1],-L*5+LAND[2]), u=ease(seg(p,.9,.975));
  const arc=V3(0,Math.sin(u*Math.PI)*.5,0);
  return follow.clone().lerp(L6,u).add(arc);
}

/* ---------- texts ---------- */
const TX=[ // [id, from, to]
  ['t0',-1,.075],['t1',.17,.255],['t2',.285,.395],['t3',.435,.545],['t4',.585,.695],['t5',.735,.845],['t6',.935,2]];
const tEls=TX.map(([id])=>$(id)), lines=tEls.map(t=>[...t.querySelectorAll('.l')]);
function texts(p){
  TX.forEach(([id,a,b],k)=>{
    const el=tEls[k];
    let o=a<0?1-seg(p,b-.025,b):seg(p,a,a+.02)*(1-seg(p,b-.02,b));
    el.style.opacity=o.toFixed(3); el.style.visibility=o>0?'visible':'hidden';
    el.style.transform=`translateX(-50%) translateY(${((1-o)*12).toFixed(1)}px)`;
    lines[k].forEach((l,j)=>{ const lo=reduced.matches?1:seg(p,a+j*.008,a+j*.008+.016); l.style.opacity=lo.toFixed(3); l.style.transform=`translateY(${((1-lo)*8).toFixed(1)}px)`; });
  });
  const endFade=1-seg(scrollY, story.offsetTop+story.offsetHeight-innerHeight, story.offsetTop+story.offsetHeight-innerHeight*.3);
  tEls[6].style.opacity=(parseFloat(tEls[6].style.opacity)*endFade).toFixed(3);
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now; time+=dt;
  if(document.body.classList.contains('locked')) return;
  render();
}

/* ---------- particles for gate & card (2D canvas) ---------- */
function makeFx(cv,host,petals,dust,dark){
  const ctx=cv.getContext('2d'); let Wd=0,Hd=0,ps=[],on=false;
  const pet=y=>({k:'p',x:rnd(0,Wd),y:y??rnd(-40,Hd),vx:rnd(-.25,.25),vy:rnd(.35,.8),r:rnd(5,9),a:rnd(0,6.28),va:rnd(-.02,.02),c:Math.random()<.7?'#cdbdf2':'#fff6ee',life:1e9});
  const dot=()=>({k:'d',x:rnd(0,Wd),y:rnd(0,Hd),vx:rnd(-.1,.1),vy:rnd(-.25,-.05),r:rnd(.8,2),tw:rnd(0,6.28),life:1e9});
  function fit(){ const d=Math.min(devicePixelRatio||1,2); Wd=host.clientWidth; Hd=host.clientHeight; cv.width=Wd*d; cv.height=Hd*d; ctx.setTransform(d,0,0,d,0,0); }
  fit(); for(let i=0;i<petals;i++) ps.push(pet()); for(let i=0;i<dust;i++) ps.push(dot());
  function step(){
    if(!on) return; requestAnimationFrame(step); ctx.clearRect(0,0,Wd,Hd); ps=ps.filter(q=>q.life>0);
    for(const q of ps){
      if(q.k==='p'){ q.x+=q.vx+Math.sin(q.a)*.3; q.y+=q.vy; q.vy=Math.min(q.vy+.03,.8); q.a+=q.va; if(q.y>Hd+20){q.y=-20;q.x=rnd(0,Wd);}
        ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.a); ctx.fillStyle=q.c; ctx.globalAlpha=.85; ctx.beginPath(); ctx.ellipse(0,0,q.r,q.r*.55,0,0,6.28); ctx.fill(); ctx.restore(); }
      else if(q.k==='d'){ q.x+=q.vx; q.y+=q.vy; q.tw+=.05; if(q.y<-5){q.y=Hd+5;q.x=rnd(0,Wd);}
        ctx.globalAlpha=.35+.35*Math.sin(q.tw); ctx.fillStyle=dark?'#e9cf98':'#C9A66B'; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
      else { q.x+=q.vx; q.y+=q.vy; q.vx*=.96; q.vy=q.vy*.96+.06; q.life-=.012; ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
    }
    ctx.globalAlpha=1;
  }
  return { fit, start(){ if(!on&&!reduced.matches){on=true;fit();step();} }, stop(){on=false;},
    burst(el,dy=0,n=150){ if(reduced.matches) return; const r=el.getBoundingClientRect(), h=host.getBoundingClientRect(), x=r.left-h.left+r.width/2, y=r.top-h.top+(dy||r.height/2);
      for(let i=0;i<n;i++){ const a=rnd(0,6.28), s=rnd(1.5,6.5); ps.push({k:'b',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,r:rnd(1.2,3),life:1,c:['#f3dfae','#C9A66B','#fff6e6','#cdbdf2'][i%4]}); }
      for(let i=0;i<24;i++){ const q=pet(y); q.x=x+rnd(-30,30); q.vy=rnd(-3,-1); q.vx=rnd(-2.5,2.5); ps.push(q); } } };
}

/* ---------- music: starts on the tap on the seal, toggle with ♪ ---------- */
const audio=new Audio(); audio.preload='none'; audio.loop=true; audio.volume=.8; audio.src=CONFIG.music;
$('music').onclick=()=>{ if(audio.paused){ audio.play().catch(()=>{}); $('music').classList.remove('off'); } else { audio.pause(); $('music').classList.add('off'); } };

/* ---------- envelope gate ---------- */
const gate=$('gate'), gfx=makeFx($('gfx'),gate,16,50,true); gfx.start();
let opened=false;
function openEnv(){
  if(opened||$('seal').disabled) return; opened=true;
  audio.play().catch(()=>$('music').classList.add('off'));
  $('env').classList.add('open'); gfx.burst($('seal'));
  setTimeout(()=>gfx.burst($('env'),10,90), reduced.matches?0:900);
  setTimeout(()=>{
    scrollTo(0,0); document.body.classList.remove('locked'); gate.classList.add('hide'); last=-1; render();
    setTimeout(()=>{ gfx.stop(); gate.style.display='none'; },1300);
    $('auto').style.display='flex'; $('music').style.display='flex';
    if(!reduced.matches) setTimeout(()=>{ if(!AP.user) play(); else setBtn(); },1200); else setBtn();
  }, reduced.matches?100:2300);
}
$('seal').addEventListener('click',openEnv);

/* ---------- auto-scroll ---------- */
const AP={on:false,raf:0,tm:0};
const STOPS=[[0,2.2],[.215,4],[.34,4],[.49,4.4],[.64,3.4],[.79,3.6],[.985,2.4]];
const storyY=p=>story.offsetTop+p*(story.offsetHeight-innerHeight);
const sine=k=>.5-.5*Math.cos(Math.PI*k);
function setBtn(){ const b=$('auto'); b.querySelector('use').setAttribute('href',AP.on?'#i-pause':'#i-play'); b.setAttribute('aria-label',AP.on?'Тоқтату':'Автоматты айналдыру'); b.classList.toggle('pulse',!AP.on); }
function glide(to,dur){ return new Promise(res=>{ const from=scrollY, t0=performance.now();
  const f=now=>{ if(!AP.on) return res(false); const k=Math.min(1,(now-t0)/(dur*1000)); scrollTo(0,from+(to-from)*sine(k)); if(k<1) AP.raf=requestAnimationFrame(f); else res(true); };
  AP.raf=requestAnimationFrame(f); }); }
const hold=s=>new Promise(res=>{ AP.tm=setTimeout(()=>res(AP.on),s*1000); });
async function play(){
  if(AP.on) return; AP.on=true; setBtn();
  const y0=scrollY+4, steps=STOPS.map(([p,h])=>({y:storyY(p),h})).filter(s=>s.y>y0);
  const inv=$('invite'), invTop=inv.getBoundingClientRect().top+scrollY-16, end=document.documentElement.scrollHeight-innerHeight;
  if(invTop>y0) steps.push({y:invTop,h:2.2,d:3.4});
  steps.push({y:end,h:0,slow:true});
  for(const s of steps){
    const dist=Math.abs(s.y-scrollY), dur=s.slow?Math.max(3,dist/55):(s.d||Math.min(7,Math.max(3.6,dist/innerHeight*2.4)));
    if(!await glide(s.y,dur)) return; if(s.h&&!await hold(s.h)) return;
  }
  AP.on=false; setBtn();
}
function stopAuto(){ if(!AP.on) return; AP.on=false; cancelAnimationFrame(AP.raf); clearTimeout(AP.tm); setBtn(); }
$('auto').addEventListener('click',()=>{ AP.on?stopAuto():play(); });
['wheel','touchstart','keydown','mousedown'].forEach(ev=>addEventListener(ev,e=>{ if(e.target.closest&&e.target.closest('.fab,#gate')) return; if(opened) AP.user=true; stopAuto(); },{passive:true}));

/* ---------- invitation card ---------- */
const after=$('after'), afx=makeFx($('fx'),after,22,50,false), inv=$('invite');
new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?afx.start():afx.stop())).observe(after);
new IntersectionObserver((es,o)=>es.forEach(e=>{ if(e.isIntersecting){ inv.classList.add('show'); setTimeout(()=>afx.burst(inv,100,130),350); o.disconnect(); } }),{threshold:.2}).observe(inv);
</script>
